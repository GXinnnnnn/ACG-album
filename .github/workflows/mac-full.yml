name: macOS Full universal build only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acg-macos-release
  cancel-in-progress: false

env:
  ACG_MAC_OUTPUT: ${{ github.workspace }}/release/mac-1.2.3
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  build-full-universal:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked build tools without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install NSIS archive reader
        run: |
          if ! command -v 7zz >/dev/null; then brew install sevenzip; fi
      - name: Acquire locked native corresponding-source archive
        timeout-minutes: 25
        run: python3 scripts/acquire-mac-native-source.py "$RUNNER_TEMP/acg-native-source-input"
      - name: Build one Full universal DMG
        run: node scripts/build-mac-full.cjs
      - name: Preserve build-only package and provenance
        uses: actions/upload-artifact@v4
        with:
          name: mac-full-universal-build-only
          path: |
            release/mac-1.2.3/ACG-album-Setup-1.2.3-Full-universal.dmg
            release/mac-1.2.3/SHA256SUMS.mac.txt
            release/mac-1.2.3/build-report.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
